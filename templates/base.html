<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111713">
  <title>{{ page.title }} | TTWidgets</title>
  <link rel="stylesheet" href="css/site.css">
  <script src="js/site.js" defer></script>
</head>
<body>
  <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-controls="site-sidebar" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar"></button>
  <span class="sidebar-mark" aria-hidden="true">TTW</span>
  <div class="site-shell">
    <aside class="sidebar" id="site-sidebar" aria-label="Site navigation">
      <nav class="site-nav">
        <a href="index.html" {% if page.active == "home" %}aria-current="page"{% endif %}>Home</a>
        <a href="about.html" {% if page.active == "about" %}aria-current="page"{% endif %}>About</a>
      </nav>
    </aside>

    <main class="page-content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
